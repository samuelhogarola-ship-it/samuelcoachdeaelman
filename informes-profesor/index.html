<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Informes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/assets/img/logo-main.webp">
  <title>Informes de Alemán · Samuel Coach</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#2563eb;--accent-d:#1d4ed8;--accent-l:#eff6ff;
      --si:#16a34a;--si-bg:#f0fdf4;--si-b:#bbf7d0;
      --no:#dc2626;--no-bg:#fef2f2;--no-b:#fecaca;
      --border:#e5e7eb;--bg:#f3f4f6;--surface:#fff;
      --text:#111827;--muted:#6b7280;--r:8px;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* HEADER */
    header{background:var(--accent);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px}
    header img.logo{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex-shrink:0}
    header .hinfo{flex:1}
    header h1{font-size:18px;font-weight:700;line-height:1.2}
    header p{font-size:12px;opacity:.75;margin-top:2px}
    .btn-nuevo{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
      border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .btn-nuevo:hover{background:rgba(255,255,255,.28)}

    /* TEMPLATE BAR */
    .tbar{background:#1e3a6e;padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .tbar label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
    .tbar select{flex:1;min-width:220px;padding:7px 10px;border-radius:6px;border:none;
      font-size:13px;background:#fff;color:var(--text);cursor:pointer}
    .tbar .sep{width:1px;height:28px;background:rgba(255,255,255,.2);margin:0 4px}
    .tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;
      border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
    .tbtn:hover{background:rgba(255,255,255,.22)}
    .tbtn.danger{background:rgba(220,38,38,.25);border-color:rgba(220,38,38,.4)}
    .tbtn.danger:hover{background:rgba(220,38,38,.4)}
    .cloud-state{font-size:12px;color:rgba(255,255,255,.78);min-height:18px}

    /* CONTAINER */
    .container{max-width:960px;margin:0 auto;padding:28px 20px 80px}

    /* CARD */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
    .card-header{background:#f8fafc;border-bottom:1px solid var(--border);padding:13px 20px;
      display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
    .card-header h2{font-size:13.5px;font-weight:700;color:var(--accent);letter-spacing:.4px;text-transform:uppercase}
    .card-header .chev{font-size:16px;color:var(--muted);transition:transform .2s}
    .card-header.open .chev{transform:rotate(180deg)}
    .card-body{padding:20px}
    .card-body.hidden{display:none}
    .unit-group{display:flex;align-items:center;gap:12px;margin:28px 0 12px}
    .unit-group:first-child{margin-top:0}
    .unit-group::after{content:"";height:1px;background:var(--border);flex:1}
    .unit-group span{background:#111827;color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
    .unit-card{border-color:#dbeafe}
    .unit-card .card-header{align-items:flex-start;gap:14px;background:linear-gradient(180deg,#eff6ff 0%,#f8fafc 100%)}
    .unit-head{min-width:0;display:flex;flex-direction:column;gap:3px}
    .unit-part{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#1d4ed8}
    .unit-card .card-header h2{font-size:16px;letter-spacing:0;text-transform:none;color:#111827}
    .unit-area{font-size:12px;color:var(--muted);font-weight:600}
    .unit-card.grammar{border-left:4px solid #2563eb}
    .unit-card.vocab{border-left:4px solid #0891b2}
    .unit-card.redemittel{border-left:4px solid #7c3aed}
    .unit-card.final{border-left:4px solid #16a34a}

    /* FORM GRID */
    .fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:580px){.fg{grid-template-columns:1fr}}
    .fg-full{grid-column:1/-1}
    .fl{display:flex;flex-direction:column;gap:5px}
    .fl label{font-size:12px;font-weight:600;color:var(--muted)}
    .fl input,.fl select{border:1px solid var(--border);border-radius:6px;padding:8px 12px;
      font-size:14px;outline:none;transition:border-color .15s;width:100%}
    .fl input:focus,.fl select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .badge-prof{background:var(--accent-l);color:var(--accent);border:1px solid #bfdbfe;
      border-radius:6px;padding:8px 12px;font-size:14px;font-weight:600}

    /* PROGRESS */
    .prog-wrap{margin-bottom:14px}
    .prog-bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
    .prog-fill{height:100%;background:var(--si);border-radius:99px;transition:width .3s;width:0}
    .prog-label{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}

    /* QUICK FILL */
    .qfill{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
    .qfill span{font-size:11.5px;color:var(--muted)}
    .qfill button{font-size:11.5px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);
      background:#fff;cursor:pointer}
    .qfill button:hover{background:var(--bg)}

    /* TEMPLATE EDITOR */
    .edit-panel{background:#fff7ed;border:1px dashed #fdba74;border-radius:8px;padding:12px;margin:12px 0 14px}
    .edit-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .edit-title input{flex:1;min-width:220px;border:1px solid #fed7aa;border-radius:6px;padding:8px 10px;font-size:13px}
    .edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .edit-btn{background:#fff;border:1px solid #fed7aa;color:#9a3412;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
    .edit-btn:hover{background:#ffedd5}
    .edit-btn.danger{border-color:#fecaca;color:#b91c1c}
    .edit-btn.danger:hover{background:#fef2f2}
    .edit-row-input{flex:1;border:1px solid #fed7aa;border-radius:6px;padding:7px 9px;font-size:13px}
    .edit-row-actions{display:flex;gap:4px;flex-shrink:0}

    /* SECTION LABEL */
    .slabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
      color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
    .slabel:first-child{margin-top:0}
    .slabel-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
    .slabel-badge.visto{background:#dbeafe;color:#1d4ed8}
    .slabel-badge.logrado{background:#dcfce7;color:#15803d}

    /* ITEM ROW */
    .irow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f3f4f6}
    .irow:last-child{border-bottom:none}
    .itext{flex:1;font-size:13px;line-height:1.4}
    .tgrp{display:flex;gap:3px;flex-shrink:0}
    .bsi,.bno{border:1px solid var(--border);background:#fff;border-radius:5px;
      width:36px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;
      justify-content:center;transition:all .12s}
    .bsi:hover{border-color:var(--si);color:var(--si)}
    .bno:hover{border-color:var(--no);color:var(--no)}
    .bsi.active{background:var(--si-bg);border-color:var(--si);color:var(--si);font-weight:700}
    .bno.active{background:var(--no-bg);border-color:var(--no);color:var(--no);font-weight:700}

    /* OBS */
    .og{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:600px){.og{grid-template-columns:1fr}}
    .og-full{grid-column:1/-1}
    .ogrp{display:flex;flex-direction:column;gap:5px}
    .ogrp label{font-size:13px;font-weight:600}
    .ogrp textarea{border:1px solid var(--border);border-radius:6px;padding:9px 12px;
      font-size:13px;font-family:inherit;resize:vertical;min-height:88px;outline:none;transition:border-color .15s}
    .ogrp textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

    /* ACTIONS */
    .actions{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
    .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:8px;
      padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
    .btn-primary:hover{background:var(--accent-d)}
    .btn-sec{background:#fff;color:var(--text);border:1px solid var(--border);border-radius:8px;
      padding:12px 20px;font-size:14px;cursor:pointer}
    .btn-sec:hover{background:var(--bg)}
    .btn-suggest{background:#fff;color:var(--accent);border:1px dashed var(--accent);
      border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
    .btn-suggest:hover{background:var(--accent-l)}

    /* OVERLAY */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
      align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
    .overlay.open{display:flex}
    .modal{background:#fff;border-radius:10px;width:100%;max-width:840px;overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .modal-toolbar{background:#1e293b;color:#fff;padding:12px 18px;display:flex;gap:10px;align-items:center}
    .modal-toolbar span{flex:1;font-size:14px;font-weight:600}
    .modal-toolbar button{background:rgba(255,255,255,.15);border:none;color:#fff;
      border-radius:5px;padding:6px 14px;font-size:13px;cursor:pointer}
    .modal-toolbar button:hover{background:rgba(255,255,255,.25)}

    /* REPORT */
    .rc{padding:36px 44px;font-family:Georgia,"Times New Roman",serif;font-size:12.5px;
      line-height:1.6;color:#1a1a1a}
    .rh{display:flex;align-items:center;gap:18px;padding-bottom:18px;margin-bottom:20px;
      border-bottom:2px solid #1a1a1a}
    .rh img{width:58px;height:58px;border-radius:50%;flex-shrink:0}
    .rh-text{flex:1;text-align:center}
    .rh-title{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .rh-sub{font-size:12px;color:#444;margin-bottom:6px}
    .rh-meta{font-size:11.5px;color:#555;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
    .ru-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
      background:#eff6ff;padding:7px 12px;margin:20px 0 8px;border-left:3px solid #2563eb}
    .report-group{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
      color:#111827;border-bottom:1px solid #111827;margin:22px 0 10px;padding-bottom:4px}
    .ru-part{display:block;font-size:10px;letter-spacing:.8px;color:#2563eb;margin-bottom:2px}
    .ru-focus{display:block;font-size:12.5px;color:#111827}
    .ru-area{display:block;font-size:11px;color:#555;text-transform:none;letter-spacing:0;margin-top:1px}
    .rs-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
      color:#666;margin:10px 0 5px}
    .rc table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:12px}
    .rc table th{background:#f8f9fa;padding:5px 9px;text-align:left;border:1px solid #ccc;
      font-size:11px;font-weight:700}
    .rc table th.c{text-align:center;width:64px}
    .rc table td{padding:4px 9px;border:1px solid #ddd}
    .rc table td.c{text-align:center;font-size:13px}
    .rc table tr:nth-child(even) td{background:#fafafa}
    .r-si{color:#16a34a;font-weight:700}
    .r-no{color:#dc2626;font-weight:700}
    .r-blank{color:#ccc}
    .robs{margin-top:24px;border-top:1px solid #ccc;padding-top:18px}
    .robs-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
    .robs-text{font-size:12.5px;line-height:1.75;color:#333;white-space:pre-wrap}

    /* SAVE TEMPLATE MODAL */
    .smodal{background:#fff;border-radius:10px;width:100%;max-width:420px;padding:24px;
      box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .smodal h3{font-size:16px;font-weight:700;margin-bottom:14px}
    .smodal input{width:100%;border:1px solid var(--border);border-radius:6px;
      padding:9px 12px;font-size:14px;outline:none;margin-bottom:14px}
    .smodal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .smodal-actions{display:flex;gap:10px;justify-content:flex-end}
    .wide-modal{max-width:920px}
    .cloud-list{max-height:62vh;overflow:auto;border-top:1px solid var(--border)}
    .cloud-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
    .cloud-row:hover{background:#f8fafc}
    .cloud-row h4{font-size:14px;margin:0 0 4px}
    .cloud-row p{font-size:12px;color:var(--muted);margin:0}
    .cloud-row button{border:1px solid var(--border);background:#fff;border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer}
    .event-list{margin-top:8px;padding-left:16px;color:var(--muted);font-size:12px}
    .event-list li{margin:3px 0}

    /* PRINT */
    @media print{
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
      body>*:not(#roverlay){display:none!important}
      #roverlay{display:block!important;position:static!important;background:none!important;padding:0!important}
      .modal{box-shadow:none!important;max-width:100%!important;border-radius:0!important;width:100%!important}
      .modal-toolbar{display:none!important}
      .rc{padding:8mm 10mm!important}
      table{page-break-inside:avoid}
      .ru-title{page-break-after:avoid}
      .robs{page-break-before:auto}
      @page{margin:12mm;size:A4}
    }
  </style>
</head>

<div class="tbar">

<div class="container">

  <div class="card">
    <div class="card-header open" onclick="toggleCard(this)">
      <h2>📋 Datos del alumno/a</h2><span class="chev">▾</span>
    </div>
    <div class="card-body" id="body-info">
      <div class="fg">
        <div class="fl">
          <label>Nombre del alumno/a</label>
          <input id="alumno" type="text" placeholder="Ej.: Salliver García Martínez">
        </div>
        <div class="fl">
          <label>Email del alumno/a</label>
          <input id="alumno-email" type="email" placeholder="alumno@email.com">
        </div>
        <div class="fl">
          <label>Curso escolar</label>
          <input id="curso" type="text" value="2025 / 2026">
        </div>
        <div class="fl">
          <label>Nivel / Curso</label>
          <select id="nivel">
            <optgroup label="Nivel MCER">
              <option>A1</option><option>A2</option>
              <option>B1</option><option>B2</option>
              <option>C1</option><option>C2</option>
            </optgroup>
            <optgroup label="Educación Primaria">
              <option>1.º Primaria</option><option>2.º Primaria</option>
              <option>3.º Primaria</option><option>4.º Primaria</option>
              <option>5.º Primaria</option><option>6.º Primaria</option>
            </optgroup>
            <optgroup label="Educación Secundaria (ESO)">
              <option selected>1.º ESO</option><option>2.º ESO</option>
              <option>3.º ESO</option><option>4.º ESO</option>
            </optgroup>
            <optgroup label="Bachillerato">
              <option>1.º Bachillerato</option><option>2.º Bachillerato</option>
            </optgroup>
            <optgroup label="Otros">
              <option>Adultos / Academia</option>
              <option>Empresas</option>
              <option>Conversación</option>
            </optgroup>
          </select>
        </div>
        <div class="fl">
          <label>Fecha del informe</label>
          <input id="fecha" type="date">
        </div>
        <div class="fl">
          <label>Motivo del informe</label>
          <select id="motivo">
            <option>Informe fin de curso</option>
            <option>Preparación a examen</option>
            <option>Inicio de curso</option>
            <option>Seguimiento trimestral</option>
            <option>Informe de progreso</option>
            <option>Inicio de clases particulares</option>
          </select>
        </div>
        <div class="fl">
          <label>Profesor/a</label>
          <div class="badge-prof">Samuel · Coach de Alemán</div>
        </div>
        <div class="fl fg-full">
          <label>Notas internas del alumno/a</label>
          <input id="alumno-notas" type="text" placeholder="Objetivo, ritmo, contexto familiar o cualquier apunte útil">
        </div>
      </div>
    </div>
  </div>

  <div id="units-container"></div>

  <div class="card">
    <div class="card-header open" onclick="toggleCard(this)">
      <h2>💬 Observaciones y recomendaciones</h2><span class="chev">▾</span>
    </div>
    <div class="card-body" id="body-obs">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
        <button class="btn-suggest" onclick="autoSuggest()">✨ Sugerir texto automáticamente</button>
      </div>
      <div class="og">
        <div class="ogrp og-full">
          <label>Observaciones generales</label>
          <textarea id="obs-gen" rows="5" placeholder="El alumno / la alumna ha demostrado…"></textarea>
        </div>
        <div class="ogrp">
          <label>Aspectos positivos</label>
          <textarea id="obs-pos" rows="4" placeholder="Destaca especialmente en…"></textarea>
        </div>
        <div class="ogrp">
          <label>Aspectos a reforzar</label>
          <textarea id="obs-ref" rows="4" placeholder="Conviene trabajar más…"></textarea>
        </div>
        <div class="ogrp og-full">
          <label>Recomendaciones para el siguiente curso / fase</label>
          <textarea id="obs-rec" rows="3" placeholder="Se recomienda…"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="generateReport()">📄 Generar informe</button>
    <button class="btn-sec" onclick="resetAll()">🔄 Reiniciar todo</button>
  </div>
</div>

<div class="overlay" id="roverlay">
  <div class="modal">
    <div class="modal-toolbar">
      <span>Informe generado</span>
      <button onclick="copyReport()">📋 Copiar texto</button>
      <button onclick="window.print()">🖨️ Imprimir / PDF</button>
      <button onclick="closeReport()">✕ Cerrar</button>
    </div>
    <div class="rc" id="report-out"></div>
  </div>
</div>

<div class="overlay" id="soverlay">

  </div>
</div>

// ── STATE ─────────────────────────────────────────
let currentUnits=cloneUnits(PRIMARIA), currentTplKey='salliver', state={}, editMode=false;
let currentStudentId=null, currentReportId=null;

function cloneUnits(units){
  return JSON.parse(JSON.stringify(units));
}

function initState(units){
  state={};
  units.forEach(u=>{state[u.id]={c:Array(u.contenidos.length).fill(null),o:Array(u.objetivos.length).fill(null)};});
}

function syncStateToUnits(){
  currentUnits.forEach(u=>{
    if(!state[u.id]) state[u.id]={c:[],o:[]};
    state[u.id].c=resizeMarks(state[u.id].c,u.contenidos.length);
    state[u.id].o=resizeMarks(state[u.id].o,u.objetivos.length);
  });
  Object.keys(state).forEach(id=>{
    if(!currentUnits.some(u=>String(u.id)===String(id))) delete state[id];
  });
}

function resizeMarks(values,len){
  const next=Array.isArray(values)?values.slice(0,len):[];
  while(next.length<len) next.push(null);
  return next;
}

function buildTemplateSelect(){
  const sel=document.getElementById('tsel');
  sel.innerHTML='';
  const fg=document.createElement('optgroup'); fg.label='— Plantillas predeterminadas —';
  Object.entries(FACTORY).forEach(([k,v])=>{
    const o=document.createElement('option'); o.value=k; o.textContent=v.name;
    if(k===currentTplKey) o.selected=true; fg.appendChild(o);
  });
  sel.appendChild(fg);
  const user=getUserTemplates();
  if(user.length){
    const ug=document.createElement('optgroup'); ug.label='— Mis plantillas guardadas —';
    user.forEach(t=>{
      const o=document.createElement('option'); o.value='user:'+t.id; o.textContent='⭐ '+t.name;
      if('user:'+t.id===currentTplKey) o.selected=true; ug.appendChild(o);
    });
    sel.appendChild(ug);
  }
  document.getElementById('btn-del-tpl').style.display=currentTplKey.startsWith('user:')? '':'none';
}

function loadTemplate(){
  const key=document.getElementById('tsel').value;
  if(!key) return;
  currentTplKey=key;
  let units;
  if(key.startsWith('user:')){
    const id=key.replace('user:','');
    const t=getUserTemplates().find(t=>t.id===id);
    if(!t) return;
    units=cloneUnits(t.units);
  } else {
    if(!FACTORY[key]) return;
    units=cloneUnits(FACTORY[key].units);
  }
  editMode=false; updateEditorButtons();
  currentUnits=units; initState(units); renderUnits();
  units.forEach(u=>updateProgress(u.id)); buildTemplateSelect();
}

function getMarkStats(){

function upsertLocalStudent(form){
  if(!form.alumno){alert('Escribe el nombre del alumno antes de guardar.'); throw new Error('Falta alumno.');}
  const now=new Date().toISOString();
  const students=getLocalStudents();
  const byCurrent=currentStudentId?students.find(s=>s.id===currentStudentId):null;
  const byEmail=form.email?students.find(s=>cleanEmail(s.email)===form.email):null;
  const byName=students.find(s=>s.full_name.toLowerCase()===form.alumno.toLowerCase()&&!form.email);
  const existing=byCurrent||byEmail||byName;
  const student={
    id:existing?existing.id:localId('student'),
    full_name:form.alumno,
    email:form.email||'',
    nivel:form.nivel,
    curso:form.curso,
    notes:form.notas||'',
    created_at:existing?existing.created_at:now,
    updated_at:now
  };
  const next=existing?students.map(s=>s.id===existing.id?student:s):[student,...students];
  setLocalStudents(next);
  return student.id;
}
async function saveCloudReport(){
  try{
    setCloudState('Guardando…');
    const form=getFormData();
    const observations=getObservations();
    const studentId=upsertLocalStudent(form);
    const reports=getLocalReports();
    const existing=currentReportId?reports.find(r=>r.id===currentReportId):null;
    const now=new Date().toISOString();
    const stats=getMarkStats();
    const version=existing?(existing.version||1)+1:1;
    const eventType=existing?'updated':'created';
    const event={
      id:localId('event'),
      event_type:eventType,
      summary:`Borrador guardado · ${stats.marked}/${stats.total} ítems marcados`,
      changes:{version,stats,template:getTemplateName()},
      created_at:now
    };
    const report={
      id:existing?existing.id:localId('report'),
      student_id:studentId,
      title:'Informe Individual de Alemán',
      status:'draft',
      motivo:form.motivo,
      nivel:form.nivel,
      curso:form.curso,
      report_date:form.fecha||'',
      form_data:form,
      template_name:getTemplateName(),
      units:JSON.parse(JSON.stringify(currentUnits)),
      marks:JSON.parse(JSON.stringify(state)),
      observations,
      version,
      events:[event,...(existing&&Array.isArray(existing.events)?existing.events:[])].slice(0,20),
      created_at:existing?existing.created_at:now,
      updated_at:now
    };
    currentStudentId=studentId;
    currentReportId=report.id;
    setLocalReports(existing?reports.map(r=>r.id===existing.id?report:r):[report,...reports]);
    setCloudState(`Guardado local v${version}`);
  }catch(err){
    setCloudState('Error local');
    alert(err.message||'No se pudo guardar el informe en este navegador.');
  }
}

function renderCloudReports(reports,students){
  const list=document.getElementById('cloud-list');
  const studentById=new Map(students.map(s=>[s.id,s]));
  if(!reports.length){
    list.innerHTML='<p style="padding:18px;color:#6b7280;font-size:13px">Todavía no hay informes guardados en este navegador.</p>';
    return;
  }
  list.innerHTML=reports.map(r=>{
    const st=studentById.get(r.student_id)||{};
    const evs=Array.isArray(r.events)?r.events.slice(0,3):[];
    const date=new Date(r.updated_at).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const evHtml=evs.length?`<ul class="event-list">${evs.map(ev=>`<li>${esc(ev.summary||ev.event_type)}</li>`).join('')}</ul>`:'';

      <div>
        <h4>${esc(st.full_name||r.form_data.alumno||'Alumno sin nombre')} · ${esc(r.nivel||'—')} · v${r.version||1}</h4>

        ${evHtml}
      </div>
      <button onclick="loadCloudReport('${r.id}')">Abrir</button>
    </div>`;
  }).join('');
}
async function loadCloudReport(reportId){
  try{
    const reports=getLocalReports();
    const report=reports.find(r=>r.id===reportId);
    if(!report) throw new Error('No se encontró el informe local.');
    const students=getLocalStudents();
    const student=students.find(s=>s.id===report.student_id)||{};
    currentReportId=report.id;
    currentStudentId=report.student_id;
    const form=report.form_data||{};
    document.getElementById('alumno').value=student.full_name||form.alumno||'';
    document.getElementById('alumno-email').value=student.email||form.email||'';
    document.getElementById('alumno-notas').value=student.notes||form.notas||'';
    document.getElementById('curso').value=report.curso||form.curso||'';
    document.getElementById('nivel').value=report.nivel||form.nivel||'A1';
    document.getElementById('fecha').value=report.report_date||form.fecha||new Date().toISOString().slice(0,10);
    document.getElementById('motivo').value=report.motivo||form.motivo||'Informe de progreso';
    currentUnits=cloneUnits(report.units||[]);
    state=report.marks||{};
    syncStateToUnits();
    setObservations(report.observations||{});
    const now=new Date().toISOString();
    report.events=[{
      id:localId('event'),
      event_type:'loaded',
      summary:'Informe abierto desde mini classroom local',
      changes:{version:report.version||1},
      created_at:now
    },...(Array.isArray(report.events)?report.events:[])].slice(0,20);
    report.updated_at=now;
    setLocalReports(reports.map(r=>r.id===report.id?report:r));
    editMode=false; updateEditorButtons(); renderUnits(); currentUnits.forEach(u=>updateProgress(u.id));
    closeCloudModal();
    setCloudState(`Abierto local v${report.version||1}`);
  }catch(err){
    setCloudState('Error al abrir');
    alert(err.message||'No se pudo abrir el informe local.');
  }
}

function deleteItem(uid,key,idx){
  const unit=currentUnits.find(u=>u.id===uid);

function renderUnits(){
  const c=document.getElementById('units-container'); c.innerHTML='';
  let lastGroup='';
  currentUnits.forEach(u=>{
    const meta=parseUnitTitle(u.title);
    if(meta.group!==lastGroup){
      const group=document.createElement('div');
      group.className='unit-group';
      group.innerHTML=`<span>${esc(meta.group)}</span>`;
      c.appendChild(group);
      lastGroup=meta.group;
    }
    renderUnit(u,c,meta);
  });
}
function parseUnitTitle(title){
  const raw=String(title||'Sección');
  const parts=raw.split('—').map(s=>s.trim());
  const part=parts.length>1?parts[0]:'';
  const rest=parts.length>1?parts.slice(1).join('—').trim():raw;
  const detail=rest.split('·').map(s=>s.trim());
  const area=detail.length>1?detail[0]:'';
  const focus=detail.length>1?detail.slice(1).join(' · ').trim():rest;
  const group=area||part||focus;
  const type=/gram[aá]t|grammat/i.test(group)?'grammar'
    :/vocab|wortschatz/i.test(group)?'vocab'
    :/rede|nomen-verb/i.test(group)?'redemittel'
    :/final|abschluss|simulaci|simulation/i.test(group)?'final':'';
  return{part,area,focus,group,type,raw};
}
function unitHeaderHtml(meta){
  return `<div class="unit-head">
    ${meta.part?`<span class="unit-part">${esc(meta.part)}</span>`:''}
    <h2>${esc(meta.focus)}</h2>
    ${meta.area?`<span class="unit-area">${esc(meta.area)}</span>`:''}
  </div>`;
}
function renderUnit(unit,container,meta=parseUnitTitle(unit.title)){
  const card=document.createElement('div'); card.className=`card unit-card ${meta.type}`;
  const editor=editMode?`
      <div class="edit-panel">
        <div class="edit-title">
          <input value="${esc(unit.title)}" onchange="renameUnit(${unit.id},this.value)" aria-label="Título de la sección">
          <button class="edit-btn danger" onclick="deleteUnit(${unit.id})">Eliminar sección</button>
        </div>
        <div class="edit-actions">
          <button class="edit-btn" onclick="addItem(${unit.id},'c')">Añadir contenido</button>
          <button class="edit-btn" onclick="addItem(${unit.id},'o')">Añadir objetivo</button>
        </div>
      </div>`:'';
  card.innerHTML=`
    <div class="card-header open" onclick="toggleCard(this)">
      ${unitHeaderHtml(meta)}<span class="chev">▾</span>
    </div>
    <div class="card-body" id="body-u${unit.id}">
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill" id="prog-${unit.id}"></div></div>
        <div class="prog-label" id="prog-lbl-${unit.id}">0 %</div>
      </div>
      <div class="qfill">
        <span>Todo:</span>
        <button onclick="fillUnit(${unit.id},'si')">✓ Visto / Logrado</button>
        <button onclick="fillUnit(${unit.id},'no')">✗ No visto / No logrado</button>
        <button onclick="fillUnit(${unit.id},null)">⬜ Limpiar</button>
      </div>
      ${editor}
      <div class="slabel">CONTENIDOS <span class="slabel-badge visto">Visto · No visto</span></div>
      <div id="cont-${unit.id}"></div>
      <div class="slabel" style="margin-top:16px">OBJETIVOS <span class="slabel-badge logrado">Logrado · No logrado</span></div>
      <div id="obj-${unit.id}"></div>
    </div>`;
  container.appendChild(card);
  renderRows(unit);
}
function renderRows(unit){
  renderSection(unit,'c',document.getElementById('cont-'+unit.id),unit.contenidos,'Visto','No visto');
  renderSection(unit,'o',document.getElementById('obj-'+unit.id),unit.objetivos,'Logrado','No logrado');

function renderSection(unit,key,el,items,lSi,lNo){
  el.innerHTML='';
  items.forEach((text,idx)=>{
    const v=state[unit.id][key][idx];
    const row=document.createElement('div'); row.className='irow';
    const label=editMode
      ? `<input class="edit-row-input" value="${esc(text)}" onchange="updateItem(${unit.id},'${key}',${idx},this.value)" aria-label="${key==='c'?'Contenido':'Objetivo'}">`
      : `<span class="itext">${esc(text)}</span>`;
    const editActions=editMode
      ? `<button class="edit-btn danger" onclick="deleteItem(${unit.id},'${key}',${idx})" title="Eliminar">Eliminar</button>`
      : '';
    row.innerHTML=`${label}
      <div class="tgrp">
        <button class="bsi${v==='si'?' active':''}" onclick="setVal(${unit.id},'${key}',${idx},'si')" title="${lSi}">✓</button>
        <button class="bno${v==='no'?' active':''}" onclick="setVal(${unit.id},'${key}',${idx},'no')" title="${lNo}">✗</button>
      </div>
      <div class="edit-row-actions">${editActions}</div>`;
    el.appendChild(row);
  });
}
function setVal(uid,key,idx,val){
  state[uid][key][idx]=state[uid][key][idx]===val?null:val;
  const unit=currentUnits.find(u=>u.id===uid); renderRows(unit); updateProgress(uid);
}
function fillUnit(uid,val){
  const unit=currentUnits.find(u=>u.id===uid);
  state[uid].c=Array(unit.contenidos.length).fill(val);
  state[uid].o=Array(unit.objetivos.length).fill(val);
  renderRows(unit); updateProgress(uid);
}
function updateProgress(uid){
  const s=state[uid], all=[...s.c,...s.o];
  const si=all.filter(v=>v==='si').length, total=all.length;
  const pct=total?Math.round(si/total*100):0;
  document.getElementById('prog-'+uid).style.width=pct+'%';
  document.getElementById('prog-lbl-'+uid).textContent=si+' de '+total+' ítems ('+pct+' %)';
}

// ── TOGGLE CARD ───────────────────────────────────
function toggleCard(h){
  const open=h.classList.contains('open');
  h.classList.toggle('open',!open);
  h.nextElementSibling.classList.toggle('hidden',open);
}

// ── AUTO-SUGGEST ──────────────────────────────────
function autoSuggest(){
  const nombre=document.getElementById('alumno').value.trim()||'El alumno / la alumna';
  const nivel=document.getElementById('nivel').value;
  const motivo=document.getElementById('motivo').value;
  const stats=currentUnits.map(u=>{
    const all=[...state[u.id].c,...state[u.id].o];
    const ev=all.filter(v=>v!==null).length, si=all.filter(v=>v==='si').length;
    return{title:u.title.split('—')[0].trim(),si,ev,pct:ev?Math.round(si/ev*100):null};
  });
  const totalEv=stats.reduce((a,b)=>a+b.ev,0), totalSi=stats.reduce((a,b)=>a+b.si,0);
  const gPct=totalEv?Math.round(totalSi/totalEv*100):0;
  const lvl=gPct>=80?'alto':gPct>=60?'satisfactorio':gPct>=40?'básico':'en desarrollo';
  const strong=stats.filter(s=>s.pct!==null&&s.pct>=70).map(s=>s.title);
  const weak=stats.filter(s=>s.pct!==null&&s.pct<50).map(s=>s.title);
  let gen=`${nombre} ha participado en el presente proceso de evaluación correspondiente a ${nivel} — ${motivo}.
`;
  gen+=`El rendimiento global se sitúa en un nivel ${lvl}, con un ${gPct} % de los contenidos y objetivos evaluados alcanzados.
`;
  if(strong.length) gen+=`Destaca de forma especial en ${strong.join(', ')}.
`;
  if(weak.length) gen+=`Se observan áreas de mejora en ${weak.join(', ')}.
`;
  gen+=`En términos generales, muestra una actitud positiva y receptiva hacia el aprendizaje del alemán.`;
  let pos=strong.length?`Demuestra un dominio sólido en ${strong.join(' y ')}, donde los resultados reflejan un trabajo constante y una comprensión clara de los contenidos.
`:'';
  pos+=`Participa activamente en las actividades propuestas y muestra motivación e interés en la mejora continua.`;
  let ref=weak.length?`Conviene prestar especial atención a ${weak.join(' y ')}, áreas donde los contenidos aún no están consolidados.
`:'';
  ref+=`Se recomienda practicar de forma más sistemática la comprensión lectora y la producción escrita en alemán.`;
  let rec=`Para la siguiente fase, se aconseja revisar los contenidos no alcanzados antes de avanzar a nuevas estructuras. `;
  rec+=`La práctica regular —canciones, lectura, aplicaciones de vocabulario, conversación— contribuirá a afianzar los aprendizajes. `;
  rec+=`Se recomienda mantener la motivación mediante actividades comunicativas y lúdicas.`;
  document.getElementById('obs-gen').value=gen;
  document.getElementById('obs-pos').value=pos;
  document.getElementById('obs-ref').value=ref;
  document.getElementById('obs-rec').value=rec;
}

// ── GENERATE REPORT ───────────────────────────────
function generateReport(){
  const alumno=document.getElementById('alumno').value.trim()||'___________________________';
  const curso=document.getElementById('curso').value.trim()||'_____ / _____';
  const nivel=document.getElementById('nivel').value;
  const fecha=fmtFecha(document.getElementById('fecha').value);
  const motivo=document.getElementById('motivo').value;
  let html=`<div class="rh">
    <img src="${LOGO_SRC}" alt="Samuel Coach de Alemán">
    <div class="rh-text">
      <div class="rh-title">Informe Individual de Alemán</div>
      <div class="rh-sub">${esc(motivo)}</div>
      <div class="rh-meta">
        <span><strong>Alumno/a:</strong> ${esc(alumno)}</span>
        <span><strong>Nivel:</strong> ${esc(nivel)} · ${esc(curso)}</span>
        <span><strong>Fecha:</strong> ${esc(fecha)}</span>
        <span><strong>Profesor/a:</strong> Samuel · Coach de Alemán</span>
      </div>
    </div>
  </div>`;
  let lastGroup='';
  currentUnits.forEach(u=>{
    const meta=parseUnitTitle(u.title);
    if(meta.group!==lastGroup){
      html+=`<div class="report-group">${esc(meta.group)}</div>`;
      lastGroup=meta.group;
    }
    html+=`<div class="ru-title">
      ${meta.part?`<span class="ru-part">${esc(meta.part)}</span>`:''}
      <span class="ru-focus">${esc(meta.focus)}</span>
      ${meta.area?`<span class="ru-area">${esc(meta.area)}</span>`:''}
    </div>`;
    html+=`<div class="rs-label">CONTENIDOS</div>`;
    html+=buildTable(u.contenidos,state[u.id].c,'Contenido','Visto','No visto');
    html+=`<div class="rs-label" style="margin-top:8px">OBJETIVOS</div>`;
    html+=buildTable(u.objetivos,state[u.id].o,'Objetivo','Logrado','No logrado');
  });
  const og=document.getElementById('obs-gen').value.trim();
  const op=document.getElementById('obs-pos').value.trim();
  const or_=document.getElementById('obs-ref').value.trim();
  const oc=document.getElementById('obs-rec').value.trim();
  if(og||op||or_||oc){
    html+=`<div class="robs">`;
    if(og) html+=obsBlock('Observaciones generales',og);
    if(op) html+=obsBlock('Aspectos positivos',op);
    if(or_) html+=obsBlock('Aspectos a reforzar',or_);
    if(oc) html+=obsBlock('Recomendaciones para la siguiente fase',oc);
    html+=`</div>`;
  }
  document.getElementById('report-out').innerHTML=html;
  document.getElementById('roverlay').classList.add('open');
}

function buildTable(items,vals,hdr,lSi,lNo){
  let t=`<table><tr><th>${esc(hdr)}</th><th class="c">${esc(lSi)}</th><th class="c">${esc(lNo)}</th></tr>`;
  items.forEach((item,i)=>{
    const v=vals[i];
    const si=v==='si'?'<span class="r-si">✓</span>':'<span class="r-blank">☐</span>';
    const no=v==='no'?'<span class="r-no">✗</span>':'<span class="r-blank">☐</span>';
    t+=`<tr><td>${esc(item)}</td><td class="c">${si}</td><td class="c">${no}</td></tr>`;
  });
  return t+'</table>';
}
function obsBlock(title,text){
  return `<div style="margin-bottom:16px"><div class="robs-title">${esc(title)}</div><div class="robs-text">${esc(text)}</div></div>`;
}

// ── CLOSE / COPY ──────────────────────────────────
function closeReport(){document.getElementById('roverlay').classList.remove('open');}
document.getElementById('roverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeReport();});
document.getElementById('soverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
document.getElementById('cloudoverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeCloudModal();});
function copyReport(){
  const text=document.getElementById('report-out').innerText||'';
  navigator.clipboard.writeText(text).then(()=>alert('Informe copiado al portapapeles.')).catch(()=>alert('Usa Ctrl+A para seleccionar el texto manualmente.'));
}

// ── UTILS ─────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtFecha(v){
  if(!v) return new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  const[y,m,d]=v.split('-');
  return new Date(y,m-1,d).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
}

// ── INIT ──────────────────────────────────────────
document.getElementById('fecha').value=new Date().toISOString().slice(0,10);
initState(currentUnits); updateEditorButtons(); buildTemplateSelect(); renderUnits(); currentUnits.forEach(u=>updateProgress(u.id));
setCloudState('Local');

// Check URL for ?nuevo=1
if(new URLSearchParams(location.search).get('nuevo')==='1') newReport();

// PWA
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
let _prompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); _prompt=e;
  const btn=document.createElement('button');
  btn.className='tbtn'; btn.textContent='📲 Instalar app';
  btn.onclick=()=>{_prompt.prompt();_prompt=null;btn.remove();};
  document.querySelector('.tbar').appendChild(btn);
});
</script>
