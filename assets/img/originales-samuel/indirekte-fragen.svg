<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Indirekte Fragen en alemán</title>
  <desc id="desc">Imagen social: preguntas indirectas en alemán.</desc>
  <rect width="1200" height="630" fill="#fbfbfb"/>
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="#fff" stroke="#3aa9ab" stroke-width="8"/>
  <text x="88" y="126" fill="#2c8182" font-family="Cabin,Arial,sans-serif" font-size="32" font-weight="700">Samuel Coach de Alemán</text>
  <text x="88" y="220" fill="#455a64" font-family="Lato,Arial,sans-serif" font-size="34">Wo wohnst du? →</text>
  <text x="88" y="290" fill="#0d3637" font-family="Cabin,Arial,sans-serif" font-size="42" font-weight="700">Ich weiß nicht, wo du <tspan fill="#ff6f61">wohnst</tspan>.</text>
  <text x="88" y="380" fill="#455a64" font-family="Lato,Arial,sans-serif" font-size="34">Kommt er? →</text>
  <text x="88" y="450" fill="#0d3637" font-family="Cabin,Arial,sans-serif" font-size="42" font-weight="700">Ich frage, <tspan fill="#78d95c">ob</tspan> er <tspan fill="#ff6f61">kommt</tspan>.</text>
  <text x="88" y="540" fill="#455a64" font-family="Lato,Arial,sans-serif" font-size="30">Indirekte Fragen — verbo al final</text>
</svg>
