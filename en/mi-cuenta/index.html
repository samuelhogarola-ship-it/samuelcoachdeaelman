<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Samuel Coach de Alemán</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.samuelcoachdealeman.com/en/mi-cuenta/">
  <link rel="icon" type="image/webp" href="/assets/img/favicon.webp">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cabin:wght@600;700&family=Lato:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@600;700&family=Lato:wght@400;700&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/cookie-banner-core.css">
  <script>
    window.siteLocaleContent = {
      navigation: {
        openMenu: "Open menu",
        closeMenu: "Close menu"
      }
    };
  </script>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="/en/"><img src="/assets/img/logo-main.webp" alt="Samuel Coach de Alemán" width="260" height="260"></a>
      <button class="hamburger" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu" aria-haspopup="true">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/en/">Home</a></li>
        <li><a href="/en/servicios/">Lessons</a></li>
        <li><a href="/en/recursos/">Resources</a></li>
        <li><a href="/en/sobre-mi/">About me</a></li>
      </ul>
    </div>
    <div id="mobile-menu" class="mobile-menu" hidden>
      <a href="/en/">Home</a>
      <a href="/en/servicios/">Lessons</a>
      <a href="/en/recursos/">Resources</a>
      <a href="/en/sobre-mi/">About me</a>
    </div>
  </nav>

  <main>
    <section class="login-section">
      <div class="login-card">
        <div class="login-logo">
          <img src="/assets/img/logo-main.webp" alt="Samuel Coach de Alemán" width="64" height="64">
        </div>
        <h1 style="font-size:1.2rem;text-align:center;margin-bottom:8px">My Account</h1>
        <p id="account-email" style="text-align:center;color:var(--muted);margin-bottom:28px;font-size:.9rem"></p>
        <button id="btn-signout" class="btn btn-dark login-submit">Log out</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-top">
        <a class="footer-logo footer-logo-fun" href="/en/"><img src="/assets/img/logo-fun.webp" alt="Samuel Coach de Alemán" width="180" height="180" loading="lazy"></a>
        <div class="footer-links">
          <a href="/en/recursos/">Resources</a>
          <a href="/en/servicios/">Lessons</a>
          <a href="/en/#faq">FAQ</a>
          <a href="/en/politica-de-privacidad/">Privacy policy</a>
        </div>
      </div>
      <div class="footer-bottom">Copyright © 2026 Samuel Coach de Alemán · All rights reserved.</div>
    </div>
  </footer>

  <script defer src="/assets/js/google-analytics-core.js"></script>
  <script src="/assets/js/cookie-banner-core.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script type="module">
    import { requireAuth, signOut } from '/assets/js/auth.js'

    const user = await requireAuth()
    if (user) {
      document.getElementById('account-email').textContent = user.email
    }

    document.getElementById('btn-signout').addEventListener('click', async () => {
      await signOut()
      location.href = '/en/'
    })
  </script>

</body>
</html>
